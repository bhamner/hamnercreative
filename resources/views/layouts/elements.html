

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
	<head>
		<title>Elements</title>

<style>

.button{
  height:40px;
  width:200px;
  border:0;
  background:#ccc;
  position:relative;
  margin-right:20px;
  margin-bottom:5px;
}

.hoverMebottom:after{
  position:absolute;
  top:100%;
  left:0%;
  width:0;
  height:2px;
  background:#222;
  display:block;
  content:'';
  transition: width 0.5s ease-in-out;
}
.hoverMebottom:hover:after{
  width:100%;
}
.
</style>



	</head>
	<body>
		<button class="hoverMebottom button">Hover Me Bottom</button>
	</body>
</html>
